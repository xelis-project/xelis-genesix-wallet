name: Checks · Core · Reusable

on:
  workflow_call:
    inputs:
      dart_analyze_args:
        description: Additional arguments forwarded to dart analyze
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Changes · Detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ai: ${{ steps.detect.outputs.ai }}
      dart: ${{ steps.detect.outputs.dart }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect affected checks
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          merged_pr=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            if associated_pr="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq "any(.[]; .merged_at != null and .base.ref == \"$REF_NAME\")" \
              2>/dev/null)"; then
              merged_pr="$associated_pr"
            else
              echo "::warning::Unable to inspect pull requests for $HEAD_SHA; running affected checks conservatively."
            fi
          fi

          if [[ "$merged_pr" == "true" ]]; then
            ai=false
            dart=false
            files="Merged pull request: checks already completed before merge"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ai=true
            dart=true
            files="Manual run: all checks enabled"
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
            elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              files="$(git show --pretty='' --name-only "$HEAD_SHA")"
            else
              files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            fi

            ai=false
            dart=false

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/*|.github/actions/*)
                  ai=true
                  dart=true
                  ;;
                AGENTS.md|CLAUDE.md|.agents/*|.codex/*|.claude/*|.github/agents/*|.github/skills/*|.github/copilot-instructions.md|tool/validate_ai_guidelines.dart)
                  ai=true
                  ;;
                lib/*|tool/*|test/*|integration_test/*|pubspec.yaml|pubspec.lock|analysis_options.yaml|l10n.yaml)
                  dart=true
                  ;;
              esac
            done <<< "$files"
          fi

          echo "ai=$ai" >> "$GITHUB_OUTPUT"
          echo "dart=$dart" >> "$GITHUB_OUTPUT"

          {
            echo "### Affected checks"
            echo "- AI guidelines: $ai"
            echo "- Dart: $dart"
            echo ""
            echo "### Changed files"
            echo '```text'
            printf '%s\n' "$files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ai-guidelines:
    name: AI · Guidelines
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check validator formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          tool/validate_ai_guidelines.dart

      - name: Validate AI guidelines
        run: dart tool/validate_ai_guidelines.dart

  dart-analyze:
    name: Dart · Analyze
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib tool

      - name: Cache build_runner state
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: >-
            ${{ runner.os }}-build-runner-${{ hashFiles('pubspec.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-build-runner-${{ hashFiles('pubspec.lock') }}-

      - name: Generate Dart code
        run: dart run build_runner build

      - name: Dart analyze
        run: dart analyze ${{ inputs.dart_analyze_args }}

  xswd-web-test:
    name: XSWD · Lossless Web review
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart contracts for the Web review test
        run: dart run build_runner build

      - name: Verify exact Web transaction integers and bounds
        run: >-
          flutter test --platform chrome
          test/xswd_web_permission_review_test.dart

  flutter-tests:
    name: Flutter · VM and native contracts
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          cache: true

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Resolve dependencies and generate localizations
        run: flutter pub get

      - name: Generate Dart contracts
        run: dart run build_runner build

      - name: Run Flutter tests
        # FRB's Linux test loader needs the assets built by Flutter's hook.
        # Do not substitute a separately compiled rust/target library.
        env:
          FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR: ${{ github.workspace }}/build/native_assets/linux
        run: flutter test
